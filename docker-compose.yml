services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: template-web
    ports:
      - '3000:3000'
    env_file:
      - .env
    # volumes:
    restart: always
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r => r.status === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
